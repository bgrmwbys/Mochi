<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#fff1f7">
<title>Mochi Garden 🌸</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{color-scheme:light;--pink:#f8b9d2;--ink:#4c3444;--soft:#fff7fb}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(160deg,#fff0f7,#f3efff 58%,#effcf6);font-family:ui-rounded,"Trebuchet MS",system-ui,sans-serif;color:var(--ink);min-height:100vh}
main{max-width:520px;margin:auto;padding:22px 18px 36px}.hero{text-align:center;padding:20px 16px 18px;background:#ffffffb8;border:1px solid #fff;border-radius:28px;box-shadow:0 12px 36px #d6b5cc35}
.bunny{font-size:82px;line-height:1.2;filter:drop-shadow(0 7px 0 #f8d8e7)}h1{font-size:29px;margin:8px 0 5px}p{line-height:1.5}.muted{opacity:.75;font-size:14px;margin:0}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}.stat{background:#ffffffc9;border:1px solid white;border-radius:18px;padding:14px;text-align:center}.stat strong{display:block;font-size:25px}.stat span{font-size:12px;opacity:.72}
.panel{background:#ffffffb8;border:1px solid white;border-radius:24px;padding:16px;margin-top:13px}.panel h2{font-size:17px;margin:0 0 12px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}button{border:0;border-radius:16px;padding:14px 9px;font:600 14px inherit;color:#56364a;background:#ffe0ee;cursor:pointer;min-height:52px}button:nth-child(2){background:#e9e0ff}button:nth-child(3){background:#dff8ec}button:nth-child(4){background:#fff0c9}button:disabled{opacity:.6}
#result{min-height:52px;margin:12px 2px 0;font-size:14px;line-height:1.5}.bar{height:9px;background:#f2dce8;border-radius:99px;overflow:hidden;margin-top:8px}.bar div{height:100%;width:0;background:linear-gradient(90deg,#f29bc1,#b8a5f8);border-radius:99px;transition:width .3s}
.footer{text-align:center;font-size:12px;opacity:.6;margin-top:18px}
</style>
</head>
<body><main>
<section class="hero">
<div class="bunny" id="bunny">🐰</div>
<h1 id="greeting">Welcome to Mochi Garden!</h1>
<p class="muted">A tiny pocket of soft things and good luck 🌸</p>
</section>
<div class="stats">
<div class="stat"><strong id="hearts">💖 0</strong><span>HEARTS COLLECTED</span></div>
<div class="stat"><strong id="level">⭐ 1</strong><span>MOCHI LEVEL</span></div>
</div>
<section class="panel"><h2>🌷 Your next little moment</h2>
<div class="actions">
<button data-action="pet">🐰 Pet Mochi</button>
<button data-action="quest">🌱 Tiny quest</button>
<button data-action="fortune">🔮 Fortune cookie</button>
<button data-action="daily">💖 Daily hug</button>
</div>
<div id="result" role="status">Mochi is fluffing their ears and waiting for you…</div>
<div class="muted">Next level progress</div><div class="bar"><div id="progress"></div></div>
</section>
<p class="footer">Made with 97% fluff and 3% mysterious bunny science ✨</p>
</main>
<script>
const tg = window.Telegram?.WebApp;
tg?.ready(); tg?.expand();
const $ = id => document.getElementById(id);
function showProfile(p){
  $('greeting').textContent = `Welcome, ${p.name || 'friend'}! 🌸`;
  $('hearts').textContent = `💖 ${p.hearts || 0}`;
  $('level').textContent = `⭐ ${p.level || 1}`;
  $('progress').style.width = `${(p.hearts || 0)%10*10}%`;
}
function call(name,input={}){
 return new Promise((resolve,reject)=>{
   if(!tg?.Serverless?.call){reject(new Error('Please open this Mini App from Telegram, not in a regular browser.'));return;}
   tg.Serverless.call(name,input,(err,data)=>err?reject(new Error(err.message||'Something went wrong')):resolve(data));
 });
}
async function refresh(){
 try{showProfile(await call('getProfile'));}
 catch(e){$('result').textContent=e.message;}
}
document.querySelectorAll('button[data-action]').forEach(btn=>btn.addEventListener('click',async()=>{
 const action=btn.dataset.action;
 document.querySelectorAll('button').forEach(b=>b.disabled=true);
 try{
   const data=await call('doAction',{action});
   $('result').textContent=data.message;
   showProfile(data.profile);
   $('bunny').textContent=action==='pet'?'🥰':action==='quest'?'🌱':action==='fortune'?'🔮':'💗';
   tg?.HapticFeedback?.impactOccurred('light');
 }catch(e){$('result').textContent=e.message;}
 finally{document.querySelectorAll('button').forEach(b=>b.disabled=false);}
}));
refresh();
</script>
</body></html>
